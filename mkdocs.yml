# =============================================================================
# SITE CONFIGURATION
# =============================================================================
site_name: OpenNotesHub
site_description: >
  Kho tài liệu mở — Nơi hệ thống hóa và chia sẻ hành trình nghiên cứu AI
  của Nguyễn Thái Học: Course Notes, Research Logs, Knowledge Base.
site_author: Nguyễn Thái Học (Thai-Hoc Nguyen)
site_url: https://nthaihoc.github.io/open-notes-hub

# =============================================================================
# REPOSITORY CONFIGURATION
# =============================================================================
repo_name: nthaihoc/open-notes-hub
repo_url: https://github.com/nthaihoc/open-notes-hub
edit_uri: edit/main/docs/

# =============================================================================
# THEME CONFIGURATION
# =============================================================================
theme:
  name: material
  logo: assets/images/logo.jpg
  favicon: assets/images/favicon.png
  
  font:
    text: Roboto
    code: JetBrains Mono
    
  palette:
    scheme: default
    primary: white
    accent: red

  features:
    # --- Content ---
    - content.code.annotate 
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    # --- Navigation ---
    - navigation.tabs
    # - navigation.instant
    # - navigation.instant.preview
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    # --- Table of Contents & Search ---
    - toc.follow
    - search.suggest
    - search.highlight

  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

# =============================================================================
# PLUGINS
# =============================================================================
plugins:
  - macros
  - search
  - i18n:
      docs_structure: suffix 
      fallback_to_default: true 
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
          
  # --- Disabled Plugins (for local testing/speed) ---
  # - git-revision-date-localized:
  #     type: timeago
  #     enable_creation_date: true
  #     fallback_to_build_date: true
  #     enable_git_follow: false 
  # - git-committers:
  #     enabled: !ENV [CI, false] 
  #     repository: nthaihoc/open-notes-hub
  #     branch: main
  #     token: !ENV [MKDOCS_GIT_COMMITTERS_APIKEY, ""]

# =============================================================================
# MARKDOWN EXTENSIONS
# =============================================================================
markdown_extensions:
  # --- Standard Markdown ---
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      title: Table of Contents
      
  # --- PyMdown Extensions (UI & Formatting) ---
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.blocks.definition
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark 
  - pymdownx.smartsymbols
  - pymdownx.tilde
  
  # --- Features & Integrations ---
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji  
      emoji_generator: !!python/name:material.extensions.emoji.to_svg 
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# =============================================================================
# EXTRA ASSETS & CONFIGURATION
# =============================================================================
extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra:
  generator: false
  alternate:
    - name: English
      link: /open-notes-hub/
      lang: en
    - name: Vietnamese
      link: /open-notes-hub/vi/
      lang: vi
      
  social:
    - icon: material/school
      link: https://ictu.edu.vn
      name: Thai Nguyen University of Information and Technology Communication
    - icon: material/domain
      link: https://iast.ictu.edu.vn
      name: Institute of Applied Science Technology
    - icon: material/web
      link: https://nthaihoc.github.io/about-me
      name: Profile
    - icon: material/email-multiple-outline
      link: mailto:thaihoc.ictu@gmail.com
      name: Email
    - icon: material/github
      link: https://github.com/nthaihoc
      name: Github
    - icon: material/facebook
      link: https://www.facebook.com/nthoc.02
      name: Facebook

copyright: >
  ©️ 2025 by Thai-Hoc Nguyen.
  Built with <a href="https://squidfunk.github.io/mkdocs-material/">Material for MkDocs</a>.

