# site configuration
site_name: OpenNotesHub
site_description: >
  Kho tài liệu mở — Nơi hệ thống hóa và chia sẻ hành trình nghiên cứu AI
  của Nguyễn Thái Học: Course Notes, Research Logs, Knowledge Base.
site_author: Nguyễn Thái Học (Thai-Hoc Nguyen)
site_url: https://nthaihoc.github.io/open-notes-hub/

# repo configuration
repo_name: nthaihoc/open-notes-hub
repo_url: https://github.com/nthaihoc/open-notes-hub
edit_uri: edit/main/docs/

# theme configuration
theme:
  name: material
  favicon: assets/images/favicon.svg

  font:
    text: Inter
    code: Geist Mono
    
  palette:
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    # --- Content ---
    - content.code.annotate 
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.action.edit
    - content.action.view
    # --- Navigation ---
    - navigation.tabs
    # - navigation.instant
    # - navigation.instant.preview
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    # --- Table of Contents & Search ---
    - toc.follow
    - search.suggest
    - search.highlight

  icon:
    logo: material/sprout
    repo: material/source-branch
    edit: material/file-edit-outline
    view: material/file-code-outline
    previous: material/chevron-left
    next: material/chevron-right

    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

# plugins configuration
plugins:
  - search
  - markdown-exec
  - macros
  - bibtex:
      bib_file: "docs/assets/files/references.bib"
      csl_file: "docs/assets/files/ieee.csl"
      bib_by_default: false

  - i18n:
      docs_structure: suffix 
      fallback_to_default: true 
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
  - material/tags

  # --- Disabled Plugins (for local testing/speed) ---
  - git-revision-date-localized:
      type: timeago
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: !ENV [CI, false]
  - git-committers:
      enabled: !ENV [CI, false] 
      repository: nthaihoc/open-notes-hub
      branch: main
      token: !ENV [MKDOCS_GIT_COMMITTERS_APIKEY, ""]

# markdown extensions configuration
markdown_extensions:
  # --- Standard Markdown ---
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      title: Table of Contents
      
  # --- PyMdown Extensions (UI & Formatting) ---
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.blocks.definition
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark 
  - pymdownx.smartsymbols
  - pymdownx.tilde
  
  # --- Features & Integrations ---
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji  
      emoji_generator: !!python/name:material.extensions.emoji.to_svg 
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# extra configuration
extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - assets/javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra:
  links:
    courses: courses/
    knowledge_base: knowledge-base/

    aml:
      root: courses/applied-machine-learning/
      syllabus: courses/applied-machine-learning/#aml-syllabus
      les09: courses/applied-machine-learning/09-support-vector-machines
      les10: courses/applied-machine-learning/10-decision-trees

    llm:
      root: courses/large-language-models/
      les03: courses/large-language-models/03-attention-mechanisms

    cv:
      root: courses/computer-vision-foundations/
      les01: courses/computer-vision-foundations/01-dl-loss-function
      les02: courses/computer-vision-foundations/02-optimization

    fastapi:
      les01: knowledge-base/fastapi/01-overview

    rag:
      les01: knowledge-base/rag/01-vanilla-rag

  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
    feedback:
          title: Was this note helpful?
          ratings:
            - icon: material/thumb-up-outline
              name: This note was helpful
              data: 1
              note: >-
                Thanks for your feedback! Glad this note was helpful.
            - icon: material/thumb-down-outline
              name: This note could be improved
              data: 0
              note: >-
                Thanks for your feedback! Help improve this note by
                <a href="https://github.com/nthaihoc/open-notes-hub/issues/new?title=[Feedback]%20{title}&body=**Page:**%20{url}%0A%0A**What%20could%20be%20improved%20(typo,%20math%20derivation,%20code%20example,%20etc.)?:**%0A" target="_blank" rel="noopener">opening an issue on GitHub</a>.

  generator: false
  alternate:
    - name: English
      link: /open-notes-hub/
      lang: en
    - name: Vietnamese
      link: /open-notes-hub/vi/
      lang: vi
      
  social:
    - icon: material/school
      link: https://ictu.edu.vn
      name: Thai Nguyen University of Information and Technology Communication
    - icon: material/web
      link: https://nthaihoc.github.io/about-me
      name: Profile
    - icon: material/email-multiple-outline
      link: mailto:nthoc.ictu@gmail.com
      name: Email
    - icon: material/github
      link: https://github.com/nthaihoc
      name: Github

copyright: >
  Built with ❤️ by <a href="https://github.com/nthaihoc">Thai Hoc Nguyen</a> <br>
  Made with <a href="https://squidfunk.github.io/mkdocs-material/">Material for MkDocs</a>

# navigation configuration  
nav:
  - Home: index.md
  - Course Notes:
    - Overview: courses/index.md
    - "Applied Machine Learning":
      - courses/applied-machine-learning/index.md
      - courses/applied-machine-learning/09-support-vector-machines.md
      - courses/applied-machine-learning/10-decision-trees.md
    - "Computer Vision Foundations":
      - courses/computer-vision-foundations/index.md
      - courses/computer-vision-foundations/01-dl-loss-function.md
      - courses/computer-vision-foundations/02-optimization.md
    - "Large Language Models":
      - courses/large-language-models/index.md
      - courses/large-language-models/03-attention-mechanisms.md

  - Knowledge Base:
    - Overview: knowledge-base/index.md
    - "FastAPI Tutorials":
      - knowledge-base/fastapi/01-overview.md
    - "RAG Framework":
      - knowledge-base/rag/01-vanilla-rag.md

  - Tags: tags.md
  - About Me: about-me/index.md